name: K-12 School Management System CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Build Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd apps/backend && npm ci
      - name: Build TypeScript
        run: cd apps/backend && npm run build

  parent-student-app:
    name: Build Flutter Parent & Student App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk
          yes | /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" 2>/dev/null || true
      - name: Get Flutter dependencies
        run: cd apps/parent-student-app && flutter pub get
      - name: Build APK
        run: cd apps/parent-student-app && flutter build apk --release --no-tree-shake-icons
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parent-student-apk
          path: apps/parent-student-app/build/app/outputs/flutter-apk/app-release.apk

  teacher-staff-app:
    name: Build Teacher & Staff App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd apps/teacher-staff-app && npm ci
      - name: Build React app
        run: cd apps/teacher-staff-app && npm run build
      - name: Sync Capacitor Android
        run: cd apps/teacher-staff-app && npx cap sync android
      - name: Build Android APK
        run: |
          cd apps/teacher-staff-app/android
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -20
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-staff-apk
          path: apps/teacher-staff-app/android/app/build/outputs/apk/release/app-release.apk

  memory-system:
    name: Build Memory System
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Test memory system
        run: cd memory && node save.js list
